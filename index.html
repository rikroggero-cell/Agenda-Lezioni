<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Agenda insegnante</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#dbe2ec;--ac:#2563eb;--acbg:#e8efff;--ok:#15803d;--bad:#b91c1c;--badbg:#fdecec;--warn:#92400e;--warnbg:#fff4d6;--pv:#7c3aed;--pvbg:#f1eaff;--c1:#0891b2;--c2:#16a34a;--c3:#d97706;--c4:#db2777;--c5:#7c3aed;--c6:#2563eb;--hd1:#2563eb;--hd2:#0891b2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1521;--card:#18202f;--tx:#e6ebf4;--mu:#93a1b8;--bd:#2a3548;--ac:#6ea0ff;--acbg:#1d2b4a;--ok:#5fd38a;--bad:#ff8e8e;--badbg:#3a1f25;--warn:#f4c77a;--warnbg:#3a301a;--pv:#b79bff;--pvbg:#2b2447;--c1:#22d3ee;--c2:#4ade80;--c3:#fbbf24;--c4:#f472b6;--c5:#a78bfa;--c6:#60a5fa;--hd1:#1e3a8a;--hd2:#155e75}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin:0 -14px 10px;padding:16px 14px 14px;background:linear-gradient(120deg,var(--hd1),var(--hd2));color:#fff;border-radius:0 0 18px 18px}header h1{font-size:20px;margin:0}header .sub{color:rgba(255,255,255,.82);font-size:13px}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:2}
.tabs button{flex:1;white-space:nowrap;font-size:15px;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button{border-bottom:3px solid var(--tc)}.tabs button[data-t=o]{--tc:var(--c6)}.tabs button[data-t=p]{--tc:var(--c3)}.tabs button[data-t=s]{--tc:var(--c5)}.tabs button.on{background:var(--tc);border-color:var(--tc);color:#fff}@media (prefers-color-scheme:dark){.tabs button.on{color:#0f1521}}
.bar{display:flex;gap:8px;align-items:center;margin:8px 0}.bar .grow{flex:1}
button,input{font:inherit}button.b{padding:9px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px}
button.b.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.dayt{font-weight:700;font-size:17px;text-align:center;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.les{display:flex;gap:12px;align-items:flex-start;border-left:5px solid var(--lc,var(--c1));background:linear-gradient(90deg,color-mix(in srgb,var(--lc,var(--c1)) 13%,var(--card)),var(--card) 60%)}.les .t{color:var(--lc,var(--c1))}.les .t{min-width:92px;font-variant-numeric:tabular-nums;font-weight:700}.les .t small{display:block;font-weight:400;color:var(--mu)}
.les .w b{font-weight:600}.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;margin-left:5px;background:var(--acbg);color:var(--ac)}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.pv{background:var(--pvbg);color:var(--pv)}
.off{--lc:#9ca3af!important;opacity:.7}.off .w b{text-decoration:line-through}
.ev{border-style:dashed;background:transparent}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:14px}
.wk h3{margin:16px 2px 4px;font-size:15px}.wk h3{padding-left:8px;border-left:4px solid var(--c6)}.wk h3.today{color:var(--ac);border-left-color:var(--c3)}.banner{border-left:5px solid var(--c3)}
h2.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:18px 2px 4px}
.rem .d{color:var(--mu);font-size:13px}.rem{border-left:5px solid var(--c2);background:linear-gradient(90deg,color-mix(in srgb,var(--c2) 11%,var(--card)),var(--card) 60%)}.rem.late{border-left-color:var(--bad);background:linear-gradient(90deg,var(--badbg),var(--card) 60%)}.rem.now{border-left-color:var(--c3);background:linear-gradient(90deg,var(--warnbg),var(--card) 60%)}.rem p{margin:4px 0 0;white-space:pre-wrap;font-size:15px}
details.show{border-top:5px solid var(--c5);background:linear-gradient(180deg,color-mix(in srgb,var(--c5) 10%,var(--card)),var(--card) 90px)}details.show .nm{font-size:17px}details.show summary{cursor:pointer;list-style:none}ol.sc li::marker{color:var(--c5);font-weight:700}details.show summary::-webkit-details-marker{display:none}
details.show .nm{font-weight:700}ol.sc{margin:10px 0 4px;padding-left:24px}ol.sc li{margin:7px 0}ol.sc .who{display:block;color:var(--mu);font-size:14px}
.ppl{margin-top:8px;font-size:14px;color:var(--mu)}
.fm{display:grid;gap:8px}.fm input,.fm textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.fm .row{display:flex;gap:8px}.fm .row>*{flex:1}.pri{background:var(--c3);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700}.pend{border-left-color:var(--c4)!important}.tag.pk{background:#fde7f3;color:var(--c4)}.lnk{background:none;border:0;color:var(--ac);padding:4px 0;text-decoration:underline;font-size:14px}
.lock{max-width:360px;margin:12vh auto;text-align:center}.lock input[type=password]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:12px 0 8px}
.lock .go{width:100%;padding:12px;border:0;background:var(--ac);color:#fff;border-radius:10px;font-weight:700}.lock label{font-size:14px;color:var(--mu)}.err{color:var(--bad);min-height:1.4em;font-size:14px}
</style></head><body><div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DN = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'], MN = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const pad = n => String(n).padStart(2,'0'), iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parse = s => { const p = s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2],12); };
const addD = (s,n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dlong = s => { const d = parse(s); return DN[d.getDay()] + ' ' + d.getDate() + ' ' + MN[d.getMonth()]; };
const dshort = s => { const d = parse(s); return DN[d.getDay()].slice(0,3) + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1); };
const IC = {}, ic = i => { if (!i) return 'var(--c1)'; if (!(i in IC)) IC[i] = 'var(--c' + (1 + Object.keys(IC).length % 5) + ')'; return IC[i]; };
const hm = m => pad(Math.floor(m/60)) + ':' + pad(m%60);
const today = () => iso(new Date());
const b64 = u => Uint8Array.from(atob(u),c => c.charCodeAt(0));
let A = null, PW = '', PEND = [], MSG = '', st = {tab:'o',day:today(),mode:'g',form:false};
const gh = () => { try { return JSON.parse(localStorage.getItem('agenda-gh') || '{}'); } catch (e){ return {}; } };
const ghSet = c => { try { localStorage.setItem('agenda-gh',JSON.stringify(c)); } catch (e){} };
const defRepo = () => { const m = location.hostname.match(/^([^.]+)\.github\.io$/), seg = location.pathname.split('/').filter(Boolean)[0]; return m && seg && !/\.html$/.test(seg) ? m[1] + '/' + seg : ''; };
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null,u8.subarray(i,i + 8192)); return btoa(s); };
async function encrypt(obj,pass){
  const it = 200000, salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k0 = await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['encrypt']);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({v:1,it,salt:b64e(salt),iv:b64e(iv),data:b64e(ct)});
}
async function ghFile(path){
  const c = gh(), r = await fetch('https://api.github.com/repos/' + c.repo + '/contents/' + path,{headers:{'Authorization':'Bearer ' + c.token,'Accept':'application/vnd.github+json'},cache:'no-store'});
  if (r.status === 404) return {sha:'',items:[]};
  if (r.status === 401 || r.status === 403) throw new Error('token non valido o senza permesso');
  if (!r.ok) throw new Error('GitHub ha risposto ' + r.status);
  const j = await r.json(), txt = new TextDecoder().decode(b64(j.content.replace(/\s/g,'')));
  return {sha:j.sha,items:txt.trim() ? await decrypt(JSON.parse(txt),PW) : []};
}
async function ghPut(path,items,sha){
  const c = gh(), body = {message:'Promemoria dal telefono',content:b64e(new TextEncoder().encode(await encrypt(items,PW)))}; if (sha) body.sha = sha;
  return fetch('https://api.github.com/repos/' + c.repo + '/contents/' + path,{method:'PUT',headers:{'Authorization':'Bearer ' + c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
}
async function loadPend(){ const c = gh(); if (!c.token || !c.repo){ PEND = []; return; } try { PEND = (await ghFile('inbox.dat')).items; } catch (e){ PEND = []; } }
async function sendRem(r){
  for (let k = 0; k < 3; k++){
    const f = await ghFile('inbox.dat'), res = await ghPut('inbox.dat',f.items.concat([r]),f.sha);
    if (res.ok){ PEND = f.items.concat([r]); return; }
    if (res.status !== 409 && res.status !== 422) throw new Error(res.status === 401 || res.status === 403 ? 'token non valido o senza permesso' : 'errore GitHub ' + res.status);
  }
  throw new Error('conflitto, riprova');
}
async function decrypt(box,pass){
  const k0 = await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(box.salt),iterations:box.it || 200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(box.iv)},k,b64(box.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lock(msg){
  $('#app').innerHTML = '<div class="lock"><h1>Agenda</h1><div class="mu">Inserisci la password</div><input type="password" id="pw" autocomplete="current-password" autofocus><label><input type="checkbox" id="rem" checked> ricorda su questo dispositivo</label><div class="err" id="er">' + esc(msg || '') + '</div><button class="go" id="go">Apri</button></div>';
  const go = () => open($('#pw').value,$('#rem').checked); $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}
let BOX = null;
async function load(){
  try { const r = await fetch('agenda.dat?' + Date.now(),{cache:'no-store'}); if (!r.ok) throw 0; BOX = await r.json(); }
  catch (e){ $('#app').innerHTML = '<div class="lock"><h1>Agenda</h1><p class="mu">Dati non disponibili. Il file <code>agenda.dat</code> non è stato ancora caricato.</p></div>'; return; }
  let pw = ''; try { pw = localStorage.getItem('agenda-pw') || ''; } catch (e){}
  if (pw) open(pw,true,true); else lock();
}
async function open(pw,remember,silent){
  try { A = await decrypt(BOX,pw); } catch (e){ try { localStorage.removeItem('agenda-pw'); } catch (x){} lock(silent ? '' : 'Password errata'); return; }
  PW = pw; try { if (remember) localStorage.setItem('agenda-pw',pw); } catch (e){}
  render(); loadPend().then(() => { if (st.tab === 'p') render(); });
}
function badge(l){
  return (l.st === 'absent_student' ? '<span class="tag bad">allievo assente</span>' : l.st === 'absent_teacher' ? '<span class="tag bad">insegnante assente</span>' : l.st === 'cancelled' ? '<span class="tag bad">annullata</span>' : '')
    + (l.r ? '<span class="tag">recupero</span>' : '') + (l.x ? '<span class="tag warn">+' + l.x + '′ recupero</span>' : '') + (l.p ? '<span class="tag pv">privato</span>' : '');
}
function dayHtml(d,compact){
  const D = A.days.find(x => x.d === d), out = [];
  if (D && D.c) out.push('<div class="banner">🚫 ' + esc(D.c) + '</div>');
  const items = D ? D.l.map(l => ({s:l.s,h:'<div class="card les' + (l.st !== 'done' ? ' off' : '') + '" style="--lc:' + (l.p ? 'var(--c5)' : ic(l.i)) + '"><div class="t">' + hm(l.s) + '<small>' + hm(l.e) + ' · ' + (l.e - l.s) + '′</small></div><div class="w"><b>' + esc(l.n.join(' + ') || '—') + '</b>' + badge(l) + (l.i ? '<div class="mu">' + esc(l.i) + '</div>' : '') + '</div></div>'}))
    .concat(D.ev.map(e => ({s:e.s,h:'<div class="card les ev"><div class="t">' + hm(e.s) + '<small>' + hm(e.e) + '</small></div><div class="w mu">' + esc(e.t) + '</div></div>'}))).sort((a,b) => a.s - b.s) : [];
  items.forEach(i => out.push(i.h));
  if (!items.length && !(D && D.c)){ out.push('<div class="mu" style="padding:8px 2px">' + (d < (A.from || addD(A.today,-7)) || d > (A.to || addD(A.today,120)) ? 'Fuori dal periodo caricato.' : 'Nessuna lezione.') + '</div>'); }
  return out.join('');
}
function viewO(){
  const d = st.day, t = today();
  let h = '<div class="bar"><button class="b' + (st.mode === 'g' ? ' on' : '') + '" data-m="g">Giorno</button><button class="b' + (st.mode === 's' ? ' on' : '') + '" data-m="s">Settimana</button><span class="grow"></span><button class="b" data-go="t">Oggi</button></div>';
  if (st.mode === 'g'){
    h += '<div class="bar"><button class="b" data-n="-1">◀</button><div class="dayt">' + dlong(d) + (d === t ? ' <span class="tag">oggi</span>' : '') + '</div><button class="b" data-n="1">▶</button></div>' + dayHtml(d);
  } else {
    const dt = parse(d), mon = addD(d,-((dt.getDay() + 6) % 7));
    h += '<div class="bar"><button class="b" data-n="-7">◀</button><div class="dayt">' + dshort(mon) + ' – ' + dshort(addD(mon,6)) + '</div><button class="b" data-n="7">▶</button></div><div class="wk">';
    for (let i = 0; i < 7; i++){ const x = addD(mon,i); const hh = dayHtml(x); if (i === 6 && /Nessuna lezione/.test(hh)) continue; h += '<h3' + (x === t ? ' class="today"' : '') + '>' + dlong(x) + '</h3>' + hh; }
    h += '</div>';
  }
  return h;
}
function remForm(){
  const c = gh(), setup = !c.token || !c.repo;
  if (setup) return '<div class="card"><b>Collega GitHub (una volta sola)</b><p class="mu">Per aggiungere promemoria da qui serve il token di accesso (lo stesso creato per il registro, oppure uno nuovo con permesso «Contents: Read and write»). Resta solo su questo telefono.</p><div class="fm"><input id="g-repo" placeholder="nome-utente/repository" value="' + esc(c.repo || defRepo()) + '"><input id="g-tok" type="password" placeholder="token github_pat_…" autocomplete="off"><button class="pri" data-a="gsave">Salva</button></div></div>';
  return '<div class="card"><b>Nuovo promemoria</b><div class="fm" style="margin-top:8px"><input id="r-t" placeholder="Cosa devo ricordare?" autocomplete="off"><div class="row"><input id="r-d" type="date" value="' + today() + '"></div><textarea id="r-n" rows="3" placeholder="Nota (facoltativa)"></textarea><div class="row"><button class="b" data-a="rcancel">Annulla</button><button class="pri" data-a="rsave">Salva promemoria</button></div></div></div>';
}
function viewP(){
  const t = today(), sec = (n,l,c) => l.length ? '<h2 class="sec">' + n + '</h2>' + l.map(r => '<div class="card rem ' + c + (r.pend ? ' pend' : '') + '"><b>' + esc(r.t) + '</b>' + (r.pend ? '<span class="tag pk">da portare nel registro</span>' : '') + '<div class="d">' + dlong(r.d) + '</div>' + (r.n ? '<p>' + esc(r.n) + '</p>' : '') + '</div>').join('') : '';
  const R = A.reminders.concat(PEND.map(p => ({t:p.t,d:p.d,n:p.n,pend:1}))).sort((a,b) => a.d.localeCompare(b.d));
  const top = '<div class="bar"><button class="pri" style="flex:1" data-a="rnew">＋ Nuovo promemoria</button>' + (gh().token ? '<button class="lnk" data-a="gset">token</button>' : '') + '</div>' + (MSG ? '<div class="banner">' + esc(MSG) + '</div>' : '') + (st.form ? remForm() : '');
  if (!R.length) return top + '<p class="mu">Nessun promemoria.</p>';
  return top + sec('Scaduti',R.filter(r => r.d < t),'late') + sec('Oggi',R.filter(r => r.d === t),'now') + sec('In arrivo',R.filter(r => r.d > t),'');
}
function viewS(){
  if (!A.shows.length) return '<p class="mu">Nessun saggio in programma.</p>';
  return A.shows.map((sh,i) => '<details class="card show"' + (i === 0 ? ' open' : '') + '><summary><span class="nm">' + esc(sh.name) + '</span><div class="mu">' + (sh.date ? dlong(sh.date) + ' ' + sh.date.slice(0,4) : 'data da fissare') + (sh.place ? ' · ' + esc(sh.place) : '') + ' · ' + sh.items.length + (sh.items.length === 1 ? ' brano' : ' brani') + ' · ' + sh.people.length + (sh.people.length === 1 ? ' allievo' : ' allievi') + '</div></summary>'
    + (sh.items.length ? '<ol class="sc">' + sh.items.map(it => '<li><b>' + esc(it.t) + '</b>' + (it.n.length ? '<span class="who">' + it.n.map(x => esc(x.n) + (x.p ? ' (' + esc(x.p) + ')' : '')).join(', ') + '</span>' : '') + '</li>').join('') + '</ol>' : '<p class="mu">Scaletta vuota.</p>')
    + (sh.people.length ? '<div class="ppl"><b>Allievi:</b> ' + sh.people.map(esc).join(', ') + '</div>' : '') + '</details>').join('');
}
function render(){
  const up = A.generated || '', old = A.today && addD(A.today,14) < today();
  $('#app').innerHTML = '<header><h1>Agenda' + (A.teacher ? ' · ' + esc(A.teacher) : '') + '</h1><span class="sub">aggiornata il ' + esc(up) + '</span></header>' + (old ? '<div class="banner">⚠ I dati sono vecchi di oltre due settimane: l\'orario potrebbe non essere aggiornato.</div>' : '')
    + '<div class="tabs"><button data-t="o" class="' + (st.tab === 'o' ? 'on' : '') + '">Orario</button><button data-t="p" class="' + (st.tab === 'p' ? 'on' : '') + '">Promemoria' + (A.reminders.filter(r => r.d <= today()).length ? ' •' : '') + '</button><button data-t="s" class="' + (st.tab === 's' ? 'on' : '') + '">Saggi</button></div>'
    + '<div id="body">' + (st.tab === 'o' ? viewO() : st.tab === 'p' ? viewP() : viewS()) + '</div>';
}
document.addEventListener('click',e => {
  const b = e.target.closest('button'); if (!b || !A) return;
  if (b.dataset.a){ act(b.dataset.a); return; }
  if (b.dataset.t){ st.tab = b.dataset.t; render(); }
  else if (b.dataset.m){ st.mode = b.dataset.m; render(); }
  else if (b.dataset.go){ st.day = today(); render(); }
  else if (b.dataset.n){ st.day = addD(st.day,+b.dataset.n); render(); }
});
async function act(a){
  if (a === 'rnew'){ st.form = true; MSG = ''; render(); }
  else if (a === 'rcancel'){ st.form = false; render(); }
  else if (a === 'gset'){ ghSet({}); st.form = true; render(); }
  else if (a === 'gsave'){ const repo = $('#g-repo').value.trim(), token = $('#g-tok').value.trim(); if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token){ MSG = 'Scrivi repository (nome-utente/repository) e token'; render(); return; } ghSet({repo,token}); MSG = ''; render(); }
  else if (a === 'rsave'){
    const t = $('#r-t').value.trim(), d = $('#r-d').value, n = $('#r-n').value.trim(); if (!t || !d){ MSG = 'Scrivi il titolo e la data'; render(); return; }
    const btn = document.querySelector('[data-a=rsave]'); btn.disabled = true; btn.textContent = 'Invio…';
    try { await sendRem({id:Date.now().toString(36) + Math.random().toString(36).slice(2,6),t,d,n}); st.form = false; MSG = 'Salvato: comparirà nel registro al prossimo aggiornamento.'; }
    catch (e){ MSG = 'Non salvato: ' + e.message; }
    render();
  }
}
load();
})();
</script></body></html>
